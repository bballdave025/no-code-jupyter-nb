[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "no-code-jupyter-nb"
version = "0.1.0"
description = "No-code and low-code Jupyter notebook widgets and workflow helpers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

classifiers = [
  "License :: OSI Approved :: Apache Software License",
]

authors = [
  { name = "Dave Black" }
]

keywords = [
  "jupyter",
  "ipywidgets",
  "notebook",
  "widgets",
  "productivity"
]

dependencies = []

[project.optional-dependencies]
dev = [
  "build",
  "pytest",
]

release = [
  "bump-my-version",
]

notebook = [
  "ipykernel",
  "ipywidgets>=8",
  #  @TODO (bballdave025 or future maintainer):
  #+  pandas 3.x currently causes build/dependency pain on Termux/mobile 
  #+ and likely plenty of other places. 2025-05-14
  #+ Revisit after ecosystem stabilization and CI coverage.
  "pandas>=2,<3",
  "numpy>=2,<3",
]

test = [
  "pytest",
  "ipywidgets>=8",
  #  @TODO (bballdave025 or future maintainer):
  #+  pandas 3.x currently causes build/dependency pain on Termux/mobile 
  #+ and likely plenty of other places. 2025-05-14
  #+ Revisit after ecosystem stabilization and CI coverage.
  "pandas>=2,<3",
  "numpy>=2,<3"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.bumpversion]
current_version = "0.2.0"
parse = '(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)'
serialize = [
  "{major}.{minor}.{patch}"
]
commit = true
tag = true
allow_dirty = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/no_code_jupyter_nb/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'
